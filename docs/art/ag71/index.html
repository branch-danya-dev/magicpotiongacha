<header><h1>Arcane Arcade × Storybook</h1><p>AG71 · Этап A · Два варианта одного направления. Макеты поверх кадра обычного Roblox Play, не работающий интерфейс Studio. Центр и нижние зоны управления освобождены.</p><p><a href="?variant=A">A · Свободные сигилы</a> &nbsp; <a href="?variant=B">B · Быстрая закладка</a> &nbsp; <a href="?guides=1">Показать зоны управления</a></p></header><main id="boards"></main>
<script>
const atlas='concept-atlas.png';
const rects={gold:[25,110,285,285],essence:[336,76,260,320],book:[616,110,326,278],owl:[958,72,302,320],cat:[27,436,286,355],slime:[317,474,287,316],brew:[617,433,327,363],lab:[972,433,258,365],shop:[18,860,296,305],rewards:[327,860,286,310],settings:[627,855,282,312],more:[943,841,311,325]};
function art(name){const r=rects[name];return `<span class="art"><svg class="icon" viewBox="${r.join(' ')}" aria-hidden="true"><image href="${atlas}" width="1280" height="1280"/></svg></span>`;}
const labels={book:'Книга',familiars:'Спутники',brew:'Варка',lab:'Лаборат.',more:'Ещё'};
const titles={hud:'01 · Постоянный HUD',receipt:'02 · Получение Essence',book:'03 · Открытая Book',chooser:'04 · Первый фамильяр'};
function scene(variant,state){
const book=state==='book',picker=state==='chooser',gain=state==='receipt';
return `<section><div class="caption">${variant} / ${titles[state]}<small>844 × 390 · DESIGN CONCEPT</small></div><div class="scene ${variant.toLowerCase()} ${picker?'picking':''} ${book?'reading':''}">
<img class="world" src="../../evidence/ag70/r2/day-reduced-near-AG70.jpg" alt="Неизменённый фрагмент настоящего кадра Roblox Play AG70 R2">
<div class="layer"><div class="quest"><span class="level">1</span><div><small>ПЕРВЫЕ ШАГИ</small><b>${picker?'Ваше приключение начинается':'Выбери спутника'}</b></div></div>
<div class="money gold">${art('gold')}<strong>1 000</strong></div><div class="money essence ${gain?'flash':''}">${art('essence')}<strong>${gain?'5':'0'}</strong></div>
<nav class="nav">${Object.keys(labels).map(k=>`<button class="${k}" title="${labels[k]}" aria-label="${labels[k]}" data-menu="${k}">${art(k==='familiars'?'owl':k)}<span class="label">${labels[k]}</span></button>`).join('')}</nav>
<div class="secondary">${[['shop','Магазин'],['rewards','Награды'],['settings','Настройки']].map(([k,l])=>`<button title="Концепт маршрута: ${l}">${art(k)}${l}</button>`).join('')}</div>
${gain?`<div class="receipt">${art('essence')}+5</div>`:''}
${book?`<article class="book-page"><button class="close" aria-label="Закрыть книгу">×</button><div class="eyebrow">КНИГА ИСТОЧНИКА</div><h2>Гримуар</h2><div class="sub">Уровень 1 · Магия начинается здесь</div><div class="rule"></div><div class="hero">${art('book')}<div><b>+5 Essence за касание</b><p>Собирай эссенцию<br>для первых зелий.</p></div></div><div class="actions"><button class="collect">${art('essence')}Собрать +5</button><button class="upgrade">${art('gold')}900 · Улучшить</button></div><div class="foot">Источник эссенции вашей фабрики</div></article>`:''}
${picker?`<article class="chooser"><h2>Первый спутник</h2><div class="intro">Кого возьмём в наше приключение?</div><div class="pets">${[['owl','Сова'],['slime','Слизень'],['cat','Кот']].map(([k,l],i)=>`<button class="pet ${i===0?'active':''}" data-pet="${l}">${art(k)}<b>${l}</b></button>`).join('')}</div><button class="choose">Выбрать Сову</button><span class="note">Один спутник.<br>Выбор — за тобой.</span></article>`:''}
</div><div class="guides"><div class="guide core">Roblox CoreGui · резерв, не новые игровые элементы</div><div class="guide left">Движение · резерв</div><div class="guide right">Прыжок · резерв</div></div></div><div class="frame-foot">Нативный фон: AG70 R2 @ 89804f0 · обрезка без ретуши. UI: художественный концепт, не Studio verification.</div></section>`;
}
const q=new URLSearchParams(location.search),variant=q.get('variant'),state=q.get('state');
if(q.has('capture'))document.body.classList.add('single');if(q.has('sheet'))document.body.classList.add('sheet');if(q.has('guides'))document.body.classList.add('show-guides');
document.querySelector('#boards').innerHTML=(variant?[variant]:['A','B']).flatMap(v=>(state?[state]:['hud','receipt','book','chooser']).map(s=>scene(v,s))).join('');
if(q.has('sheet')){document.querySelector('header').innerHTML=`<h1>${variant==='A'?'A · Свободные сигилы':'B · Быстрая закладка'}</h1><p>Arcane Arcade × Storybook · макеты на нативном кадре AG70 R2 · этап A, ожидает выбора владельца</p>`;}
document.querySelectorAll('[data-menu="more"]').forEach(b=>b.onclick=()=>b.closest('.scene').querySelector('.secondary').classList.toggle('open'));
document.querySelectorAll('.pet').forEach(b=>b.onclick=()=>{const c=b.closest('.chooser');c.querySelectorAll('.pet').forEach(p=>p.classList.toggle('active',p===b));c.querySelector('.choose').textContent='Выбрать: '+b.dataset.pet;});
document.querySelectorAll('[data-menu="book"]').forEach(b=>b.onclick=()=>location.search=`?variant=${b.closest('.scene').classList.contains('a')?'A':'B'}&state=book`);
document.querySelectorAll('.close').forEach(b=>b.onclick=()=>location.search=`?variant=${b.closest('.scene').classList.contains('a')?'A':'B'}&state=hud`);
const audit=document.createElement('script');audit.id='design-audit';audit.type='application/json';audit.textContent=JSON.stringify([...document.querySelectorAll('.scene')].map(scene=>{const p=scene.getBoundingClientRect();return {variant:scene.classList.contains('a')?'A':'B',state:scene.parentElement.querySelector('.caption').textContent,buttons:[...scene.querySelectorAll('button')].filter(b=>b.getClientRects().length>0).map(b=>{const r=b.getBoundingClientRect();return {name:b.getAttribute('aria-label')||b.textContent.trim(),x:r.x-p.x,y:r.y-p.y,w:r.width,h:r.height};})};}));document.body.append(audit);
</script></html>
