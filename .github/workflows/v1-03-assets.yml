name: V1-03 complete source and asset delivery
on:
  push:
    branches: [chore/v1-03-studio-full-asset-package]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-source-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          lfs: true
      - name: Verify source asset bytes and package repository source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, json, hashlib, subprocess
          root=Path.cwd()
          dirs=('assets','src','qa','scripts','docs')
          included=[]
          for folder in dirs:
              included.extend(p for p in (root/folder).rglob('*') if p.is_file() and not p.is_symlink() and not (folder=='docs' and p.relative_to(root).parts[:2]==('docs','evidence')))
          for name in ('default.project.json','package.json','package-lock.json'):
              p=root/name
              if p.is_file(): included.append(p)
          for p in (root/'.github/workflows').glob('*.yml'):
              included.append(p)
          included=sorted(set(included))
          asset_files=[p for p in included if p.relative_to(root).parts[0]=='assets']
          unresolved=[str(p.relative_to(root)) for p in asset_files if p.stat().st_size<=250 and p.read_bytes().startswith(b'version https://git-lfs.github.com/spec/v1')]
          if unresolved:
              raise RuntimeError('Unresolved Git LFS source files: '+', '.join(unresolved))
          target=root/'deliverables/PotionTycoon-V1-03-Source-And-Assets.zip'
          target.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(target,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=5,allowZip64=True) as z:
              for p in included:
                  z.write(p,p.relative_to(root).as_posix())
              manifest={
                  'purpose':'Editable source, textures, meshes and archived asset inputs; NOT a Roblox game place',
                  'origin_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                  'source_baseline':'24c9e9f9d21e29194bd676b02d8f0eac884d3bf6',
                  'assets_count':len(asset_files),
                  'assets_bytes':sum(p.stat().st_size for p in asset_files),
                  'files_count':len(included),
                  'historical_video_evidence_excluded':True,
                  'note':'New Meshy prop exports not committed to this repository are not included. The source files are not magically imported in Studio; use the .rbxlx QA game place separately.'
              }
              z.writestr('SOURCE_ASSET_MANIFEST.json',json.dumps(manifest,ensure_ascii=False,indent=2))
          print(json.dumps(manifest,indent=2))
          print('archive',target,'bytes',target.stat().st_size,'sha256',hashlib.sha256(target.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V1-03-Complete-Source-Assets
          path: deliverables/PotionTycoon-V1-03-Source-And-Assets.zip
          if-no-files-found: error
          compression-level: 0
